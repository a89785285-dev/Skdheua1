name: Build APK from ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP Files
        run: |
          shopt -s nullglob
          for file in *.zip; do
            tmp="$(mktemp -d)"
            unzip -o -q "$file" -d "$tmp"

            entries=("$tmp"/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries}" ]; then
              src="${entries}"
            else
              src="$tmp"
            fi

            rm -rf "$src/.github"
            cp -r "$src"/. .
            rm -rf "$tmp"
            echo "Extracted: $file"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ioslauncher-apk
          path: app/build/outputs/apk/debug/*.apk
